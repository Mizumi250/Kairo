# Generated by export-docker.js for "kairo". Start with:
#   docker compose --env-file deploy.env up -d --build
name: kairo
services:
  proxy:
    build:
      context: ./docker
      dockerfile: Dockerfile.proxy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:-:80}"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
      - frontend
  backend:
    build:
      context: ./backend
    image: kairo-backend:latest
    restart: unless-stopped
    environment:
      APP_NAME: "kairo"
      APP_ENV: "production"
      APP_DEBUG: "false"
      APP_URL: "${PUBLIC_URL:-http://localhost:8080}"
      APP_KEY: "${APP_KEY:-}"
      LOG_CHANNEL: "stderr"
      DB_CONNECTION: "sqlite"
      DB_DATABASE: "database/arkzen/kairo.sqlite"
      SESSION_DRIVER: "file"
      CACHE_STORE: "file"
      QUEUE_CONNECTION: "database"
      BROADCAST_CONNECTION: "log"
      MAIL_MAILER: "${MAIL_MAILER:-log}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-hello@example.com}"
      ARKZEN_ENGINE_SECRET: "${ARKZEN_ENGINE_SECRET:?Set ARKZEN_ENGINE_SECRET in deploy.env}"
      ARKZEN_DB_DRIVER: "sqlite"
      ARKZEN_DB_PREFIX: "pluff"
      RUN_MIGRATIONS: "1"
    volumes:
      - backend-database:/app/database
      - backend-storage:/app/storage
  frontend:
    build:
      context: ./frontend
    image: kairo-frontend:latest
    restart: unless-stopped
volumes:
  caddy-data:
  caddy-config:
  backend-database:
  backend-storage:
